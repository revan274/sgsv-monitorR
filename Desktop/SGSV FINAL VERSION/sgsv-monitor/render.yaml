services:
  - type: web
    name: sgsv-api
    runtime: node
    rootDir: api
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # configurar manualmente en Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false   # URL de Cloudflare Pages
